# Dataset
dataset: pog_dense                   # pog | pog_dense | spotify | spotify_sparse
data_path: ./datasets

# Method
method: sem_agent              # sem_agent | baseline | candidate_reasoning

# Evaluation
num_cans: 10                  # candidates including the answer
num_token: 5                  # max partial-bundle items (-1 = no limit)
toy_eval: 20                   # -1 = full test set | N = first N samples
seed: 45                      # negative-candidate sampling seed
shuffle_seed: 41              # partial-item order seed

# LLM
llm_provider: gemini          # gemini | openai
model: gemini-3.1-flash-lite
temperature: 0.0
openai_send_temperature: false
openai_reasoning_effort: minimal

# Semantic Agent stage clients
sem_stage1_api_key_env: "GEMINI_API_KEY_2"
sem_stage2_api_key_env: "GEMINI_API_KEY_3"
sem_prediction_api_key_env: "GEMINI_API_KEY_4"

# Stage generation budgets
sem_stage1_max_output_tokens: 4000
sem_stage2_max_output_tokens: 2000
sem_prediction_max_output_tokens: 200

# Generated-code workspace and safety
sem_workspace_root: ./agent_workspaces
sem_code_timeout_seconds: 45
sem_code_max_stdout_chars: 24000
sem_code_max_stderr_chars: 10000
sem_enable_code_guard: true
sem_max_evidence_chars: 30000
sem_current_bundle_train_context_policy: allow  # allow | exclude
sem_allowed_files:
  - count.json
  - item_info.json
  - bi_train.txt
  - ui_full.txt
  - content_feature.pt
  - description_feature.pt
  - item_cf_feature.pt
  - "{dataset}_LightGCN_bi_feature.pt"

# Retry and execution
max_retries: 5
retry_wait_seconds: 30
max_concurrent: 1
output_dir: ./results
