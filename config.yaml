# Dataset
dataset: pog_dense          # pog | pog_dense | spotify | spotify_sparse
data_path: ./datasets

# Evaluation
num_cans: 10                # number of candidates including the answer
num_token: 5                # max input items per bundle (-1 = no limit)
toy_eval: 250               # -1 = full test set | N = first N samples
seed: 45                    # seed for candidate items
shuffle_seed: 41            # seed for input item order

# LLM
model: gemini-3.1-flash-lite
temperature: 0.0
max_output_tokens: 10

# Execution
max_concurrent: 1
output_dir: ./results
