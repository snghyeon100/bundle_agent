# Dataset
dataset: pog_dense          # pog | pog_dense | spotify | spotify_sparse
data_path: ./datasets

# Evaluation
num_cans: 10                # number of candidates including the answer
num_token: 5                # max input items per bundle (-1 = no limit)
toy_eval: 3               # -1 = full test set | N = first N samples
seed: 45                    # seed for candidate items
shuffle_seed: 41            # seed for input item order

# LLM
model: gemini-3.1-flash-lite
temperature: 0.0
max_output_tokens: 10
prediction_api_key_env: ""       # empty = GEMINI_API_KEY or GOOGLE_API_KEY
reasoning_api_key_env: ""        # empty = prediction key env, GEMINI_API_KEY, or GOOGLE_API_KEY
use_candidate_reasoning: false
candidate_reasoning_max_output_tokens: 1200

# Four-stage code-writing agent
use_four_stage_agent: true
agent_planning_api_key_env: "GEMINI_API_KEY_1"       # empty = prediction key env, GEMINI_API_KEY, or GOOGLE_API_KEY
agent_code_api_key_env: "GEMINI_API_KEY_2"           # empty = planning/prediction key env, GEMINI_API_KEY, or GOOGLE_API_KEY
agent_verifier_api_key_env: "GEMINI_API_KEY_1"       # empty = planning/prediction key env, GEMINI_API_KEY, or GOOGLE_API_KEY
agent_prediction_api_key_env: "GEMINI_API_KEY_2"     # empty = prediction/planning key env, GEMINI_API_KEY, or GOOGLE_API_KEY
agent_planning_max_output_tokens: 1600
agent_code_max_output_tokens: 2200
agent_verifier_max_output_tokens: 800
agent_prediction_max_output_tokens: 800
agent_max_retrieval_rounds: 2
agent_workspace_root: ./agent_workspaces
agent_evidence_output_file: output/evidence.json
agent_code_timeout_seconds: 30
agent_code_max_stdout_chars: 20000
agent_code_max_stderr_chars: 8000
agent_code_max_repair_attempts: 1
agent_enable_code_guard: true
agent_allowed_files:
  - count.json
  - item_info.json
  - bi_train.txt
  - ui_full.txt
  - content_feature.pt
  - description_feature.pt
agent_allow_interaction_embeddings: false
agent_extra_data_paths: []

max_retries: 5
retry_wait_seconds: 30

# Execution
max_concurrent: 1
output_dir: ./results
