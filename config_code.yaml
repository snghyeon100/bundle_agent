# ============================================================
# config_code.yaml - code method (Code Generation -> Prediction)
# ============================================================

# Dataset
dataset: pog_dense        # pog | pog_dense | spotify | spotify_sparse
data_path: ./datasets

# Evaluation
num_cans: 10
num_token: 5
toy_eval: 250                   # -1 = full test set | N = first N samples
seed: 45
shuffle_seed: 41

# Default LLM fallback
llm_provider: openai          # gemini | openai
model: gpt-5-mini
temperature: 0.0
openai_send_temperature: false
openai_reasoning_effort: ""

# Stage 1: executable evidence code generation
code_generation_provider: openai
code_generation_model: gpt-5-mini
code_generation_api_key_env: "DMLAB_KEY"
code_generation_max_output_tokens: 16000

# Stage 2: final prediction over item text + generated evidence
code_prediction_provider: openai
code_prediction_model: gpt-5-mini
code_prediction_api_key_env: "DMLAB_KEY"
code_prediction_max_output_tokens: 300

# Workspace and generated-code safety
code_workspace_root: ./agent_workspaces
code_code_timeout_seconds: 60
code_code_max_stdout_chars: 24000
code_code_max_stderr_chars: 10000
code_enable_code_guard: true
code_current_bundle_train_context_policy: allow
code_allowed_files:
  - count.json
  - item_info.json
  - bi_train.txt
  - ui_full.txt
  - content_feature.pt
  - description_feature.pt
  - item_cf_feature.pt
  - "{dataset}_LightGCN_bi_feature.pt"

# Retry and concurrency
max_retries: 5
retry_wait_seconds: 30
max_concurrent: 1
output_dir: ./results
